# ==========================================
# TMUX CONFIGURATION
# ==========================================
# Companion to the Neovim setup in ~/.config/nvim
# Docs: ~/.config/nvim/docs/tmux.md

# Ctrl+a prefix instead of Ctrl+b (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split with | and -, keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in the current directory
bind c new-window -c "#{pane_current_path}"

# Move between panes with Alt+arrows (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Reload the configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Mouse support
set -g mouse on

# Number from 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed, so there are no gaps
set -g renumber-windows on

# Colors. tmux-256color (not screen-256color) is what carries italics
# through to Neovim, which the nordic theme uses for comments.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Bigger scrollback
set -g history-limit 10000

# Don't rename windows automatically
set-option -g allow-rename off

# Neovim wants a low escape-time; the default 500ms makes Esc feel laggy
set -sg escape-time 10

# Tell Neovim when the terminal regains focus, so :checktime fires and
# files edited outside nvim reload (the config has an autocmd for this)
set -g focus-events on

# ==========================================
# VIM-TMUX-NAVIGATOR
# ==========================================
# Ctrl+h/j/k/l moves between Neovim splits AND tmux panes seamlessly.
# The check asks what is running in the pane: if it is Neovim, the key is
# forwarded to it; otherwise tmux handles it.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Same keys from inside tmux's copy-mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
